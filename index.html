<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MakerMatch</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🔧 MakerMatch</h1>
    <p>원하는 기기를 설명하면 필요한 부품을 추천해드립니다.</p>
  </header>


  <main>

    <!-- AI 설계 영역 -->
    <section class="ai-box">

      <h2>🤖 원하는 기기 설계하기</h2>

      <p class="description">
        만들고 싶은 기기를 자유롭게 설명해주세요.
        외부 AI API 없이 앱 내부의 분석 엔진이 필요한 부품을 추천합니다.
      </p>


      <!-- 기기 이름 -->
      <div class="input-group">

        <label for="aiDevice">
          만들고 싶은 기기
        </label>

        <input
          id="aiDevice"
          type="text"
          placeholder="예: 장애물 회피 자동차"
        >

      </div>


      <!-- 목적 -->
      <div class="input-group">

        <label for="aiPurpose">
          만들고 싶은 이유 / 목적
        </label>

        <textarea
          id="aiPurpose"
          rows="4"
          placeholder="예: 앞에 장애물이 나타나면 자동으로 피하면서 이동하는 자동차를 만들고 싶어요."
        ></textarea>

      </div>


      <!-- 기능 -->
      <div class="input-group">

        <label for="aiFunctions">
          원하는 기능
        </label>

        <textarea
          id="aiFunctions"
          rows="3"
          placeholder="예: 장애물 감지, 자동 이동, 방향 전환"
        ></textarea>

      </div>


      <!-- 예산 -->
      <div class="input-group">

        <label for="aiBudget">
          예상 예산
        </label>

        <input
          id="aiBudget"
          type="text"
          placeholder="예: 50000원"
        >

      </div>


      <!-- 보유 부품 -->
      <div class="input-group">

        <label for="aiOwnedParts">
          현재 가지고 있는 부품
        </label>

        <input
          id="aiOwnedParts"
          type="text"
          placeholder="예: Arduino Nano, 초음파 센서"
        >

        <small>
          가지고 있는 부품이 없다면 비워두세요.
        </small>

      </div>


      <!-- 버튼 -->
      <button
        id="aiDesignButton"
        onclick="requestAIDesign()"
      >
        🔍 기기 분석 및 부품 추천
      </button>


      <!-- 로딩 -->
      <div
        id="aiLoading"
        class="loading"
        style="display:none;"
      >
        🔄 기기를 분석하고 있습니다...
      </div>


      <!-- 결과 -->
      <div
        id="aiResult"
        class="result"
      ></div>

    </section>


    <!-- 기본 부품 검색 -->
    <section>

      <h2>🔩 부품 검색</h2>

      <div class="search-box">

        <input
          id="partSearch"
          type="text"
          placeholder="부품 이름을 검색하세요."
        >

        <button onclick="searchParts()">
          검색
        </button>

      </div>

      <div id="partsList"></div>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
